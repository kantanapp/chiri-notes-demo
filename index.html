<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>地理ノート（デモ）</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <h1 class="app-title">地理ノート<small class="demo-tag">デモ</small></h1>
      <nav class="tabs" id="tabs" aria-label="単元"></nav>
      <a class="score" id="score" href="#kiroku" aria-live="polite" title="記録へ"></a>
    </div>
    <div class="progress"><div class="progress-bar" id="progress-bar"></div></div>
  </header>

  <nav class="modebar" id="modebar" aria-label="読む・テスト">
    <button type="button" class="mode" data-mode="read" aria-selected="true">📖 読む</button>
    <button type="button" class="mode" data-mode="quiz" aria-selected="false">✏️ テスト</button>
  </nav>

  <main id="main">
    <div class="sheet" id="sheet"></div>
    <section class="kiroku" id="kiroku" aria-labelledby="k-title"></section>
  </main>

  <footer class="actions">
    <div class="actions-row" id="actions-read">
      <button type="button" id="btn-start" class="btn primary">✏️ テストする</button>
      <button type="button" id="btn-progress-read" class="btn">★ 記録</button>
    </div>
    <div class="actions-row" id="actions-quiz" hidden>
      <button type="button" id="btn-check" class="btn primary">答え合わせ</button>
      <button type="button" id="btn-reveal" class="btn">答えを見る</button>
      <button type="button" id="btn-progress" class="btn">★ 記録</button>
      <button type="button" id="btn-reset" class="btn ghost">消す</button>
    </div>
  </footer>

  <dialog class="result" id="result">
    <div class="result-inner">
      <div class="result-head">
        <h2 id="result-title">結果</h2>
        <div class="result-head-btns">
          <button type="button" class="btn small" id="btn-to-kiroku">★ 記録</button>
          <button type="button" class="btn ghost small" id="btn-close">閉じる</button>
        </div>
      </div>
      <div id="result-body"></div>
    </div>
  </dialog>

  <script src="data/units.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
